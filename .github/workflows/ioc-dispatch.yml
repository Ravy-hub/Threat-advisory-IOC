name: IOC Dispatch

on:
  repository_dispatch:
    types:
      - soc-ioc-submit

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest-ioc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git identity
        run: |
          git config user.name "soc-ioc-bot"
          git config user.email "soc-ioc-bot@users.noreply.github.com"

      - name: Create branch and IOC CSV file
        id: create_file
        run: |
          TS=$(date -u +"%Y%m%d-%H%M%S")
          BRANCH="ioc-ingest-${TS}"
          FILE="iocs/ioc-${TS}.csv"

          echo "Creating branch: $BRANCH"
          git checkout -b "$BRANCH"

          mkdir -p iocs
          printf '%s\n' '${{ github.event.client_payload.ioc_csv }}' > "$FILE"

          echo "Created file: $FILE"
          cat "$FILE"

          git status

          git add "$FILE"
          git commit -m "Add IOC CSV from Copilot Studio - ${TS}"

          echo "Pushing branch: $BRANCH"
          git push origin "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        id: create_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > pr_body.md <<EOF
          Automated IOC submission from Copilot Studio.

          Context label: ${{ github.event.client_payload.context_label }}
          Submitted by: ${{ github.event.client_payload.submitted_by }}
          Source: ${{ github.event.client_payload.source }}

          IOC file: ${{ steps.create_file.outputs.file }}
          EOF

          PR_URL=$(gh pr create \
            --title "SOC IOC ingest: ${{ github.event.client_payload.context_label }}" \
            --body-file pr_body.md \
            --head "${{ steps.create_file.outputs.branch }}" \
            --base main)

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Display branch and PR URL
        run: |
          echo "Branch created: ${{ steps.create_file.outputs.branch }}"
          echo "IOC file: ${{ steps.create_file.outputs.file }}"
          echo "Pull Request URL: ${{ steps.create_pr.outputs.pr_url }}"
