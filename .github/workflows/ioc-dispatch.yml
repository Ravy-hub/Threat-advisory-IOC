name: IOC Dispatch

on:
  repository_dispatch:
    types:
      - soc-ioc-submit

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest-ioc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git identity
        run: |
          git config user.name "soc-ioc-bot"
          git config user.email "soc-ioc-bot@users.noreply.github.com"

      - name: Create IOC CSV file
        run: |
          mkdir -p iocs
          TS=$(date -u +"%Y%m%d-%H%M%S")
          FILE="iocs/ioc-${TS}.csv"

          printf '%s\n' '${{ github.event.client_payload.ioc_csv }}' > "$FILE"

          echo "Created file: $FILE"
          cat "$FILE"

          echo "file=$FILE" >> "$GITHUB_ENV"

      - name: Commit IOC CSV
        run: |
          git add "$file"
          git commit -m "Add IOC CSV from Copilot Studio"
          git push
