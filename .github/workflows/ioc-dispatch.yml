name: IOC Dispatch

on:
  repository_dispatch:
    types:
      - soc-ioc-submit

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Display Payload
        run: |
          echo '${{ toJson(github.event.client_payload) }}'

      - name: Create IOC CSV
        run: |
          mkdir -p iocs
          echo '${{ github.event.client_payload.ioc_csv }}' > iocs/test.csv

      - name: Display CSV
        run: |
          cat iocs/test.csv
