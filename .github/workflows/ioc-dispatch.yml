name: IOC Dispatch

on:
  repository_dispatch:
    types:
      - soc-ioc-submit

permissions:
  contents: write

jobs:
  ingest-ioc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git identity
        run: |
          git config user.name "soc-ioc-bot"
          git config user.email "soc-ioc-bot@users.noreply.github.com"

      - name: Overwrite IOC CSV file
        run: |
          mkdir -p iocs

          FILE="iocs/ioc.csv"

          printf '%s\n' '${{ github.event.client_payload.ioc_csv }}' > "$FILE"

          echo "IOC file overwritten: $FILE"
          echo "----- IOC CSV Content -----"
          cat "$FILE"

      - name: Commit IOC CSV
        run: |
          git add iocs/ioc.csv

          if git diff --cached --quiet; then
            echo "No IOC changes detected. Nothing to commit."
          else
            git commit -m "Update IOC CSV from Copilot Studio"
            git push
          fi
